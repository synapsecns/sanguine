<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Synapse × Hypercall — Announcement in context</title>
<link rel="stylesheet" href="styles.css" />
<style>
  @media (max-width: 880px) { .sy-desktop-nav { display: none !important; } }
  #root { min-height: 100vh; }

  /* placement explorer bar */
  .bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 200; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 24px);
    padding: 10px 14px; border-radius: 14px;
    background: rgba(18,16,22,0.94); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.85);
    font-family: 'Matter', sans-serif;
  }
  .bar .grp { display: flex; align-items: center; gap: 4px; }
  .bar .lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-right: 4px; }
  .seg { display: flex; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button {
    border: none; background: transparent; color: rgba(255,255,255,0.55);
    font-family: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; transition: background .12s, color .12s;
  }
  .seg button.on { background: var(--hc-lime); color: #0a1f06; font-weight: 600; }
  .seg button:not(.on):hover { color: #fff; }
  .bar .div { width: 1px; height: 26px; background: rgba(255,255,255,0.12); }
  .bar .tag { font-size: 11px; color: rgba(255,255,255,0.4); font-family: var(--mono); letter-spacing: 0.04em; }
  @media (max-width: 760px) { .bar .lbl, .bar .div { display: none; } .bar { gap: 8px; } }
</style>
</head>
<body style="background:#0a0a0a;">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="announcements.jsx"></script>
<script type="text/babel" src="synapse-page.jsx"></script>
<script type="text/babel" src="synapse-bridge.jsx"></script>

<script type="text/babel">
const { useState } = React;

function Seg({ value, options, onChange }) {
  return (
    <div className="seg">
      {options.map((o) => {
        const v = typeof o === 'object' ? o.value : o;
        const l = typeof o === 'object' ? o.label : o;
        return <button key={v} className={value === v ? 'on' : ''} onClick={() => onChange(v)}>{l}</button>;
      })}
    </div>
  );
}

function App() {
  const [page, setPage] = useState('landing');
  const [placement, setPlacement] = useState('bandTop');
  const [identity, setIdentity] = useState('cobrand');
  const [loud, setLoud] = useState('medium');
  const [motion, setMotion] = useState('subtle');
  const [proof, setProof] = useState(true);
  const [dismissed, setDismissed] = useState(false);

  const cfg = {
    identity, loud, motion, proof, dismissible: true,
    ctaLabel: 'Trade on Hypercall',
    onDismiss: () => setDismissed(true),
  };

  const showAnn = !dismissed;
  const Page = page === 'bridge' ? SynapseBridge : SynapsePage;

  return (
    <React.Fragment>
      <Page cfg={cfg} annKey={showAnn ? placement : null} />

      {dismissed && (
        <button onClick={() => setDismissed(false)} style={{
          position: 'fixed', right: 22, bottom: 78, zIndex: 150,
          display: 'inline-flex', alignItems: 'center', gap: 9,
          padding: '10px 16px', borderRadius: 999, cursor: 'pointer',
          background: 'rgba(22,19,25,0.95)', color: '#fff',
          border: '1px solid rgba(169,250,56,0.4)', fontSize: 13.5, fontFamily: 'Matter, sans-serif',
          boxShadow: '0 18px 40px -18px rgba(0,0,0,0.8)',
        }}>
          <span className="hc-live-dot" style={{ background: 'var(--hc-lime)' }} />
          Announcement hidden · restore
        </button>
      )}

      {/* placement explorer */}
      <div className="bar">
        <div className="grp"><span className="lbl">Page</span>
          <Seg value={page} onChange={setPage}
            options={[{ value: 'landing', label: 'Landing' }, { value: 'bridge', label: 'Bridge app' }]} />
        </div>
        <div className="div" />
        <div className="grp"><span className="lbl">Placement</span>
          <Seg value={placement} onChange={(v) => { setPlacement(v); setDismissed(false); }}
            options={[{ value: 'banner', label: 'Header' }, { value: 'bandTop', label: 'Band ↑' }, { value: 'band', label: 'Band' }, { value: 'heroCallout', label: 'Hero' }, { value: 'floating', label: 'Float' }]} />
        </div>
        <div className="div" />
        <div className="grp"><span className="lbl">Identity</span>
          <Seg value={identity} onChange={setIdentity}
            options={[{ value: 'cobrand', label: 'Co-brand' }, { value: 'hypercall', label: 'Lime' }, { value: 'synapse', label: 'Synapse' }]} />
        </div>
        <div className="div" />
        <div className="grp"><span className="lbl">Loud</span>
          <Seg value={loud} onChange={setLoud} options={['subtle', 'medium', 'bold']} />
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
